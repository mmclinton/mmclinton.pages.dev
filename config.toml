# Zola configuration — see https://www.getzola.org/documentation/getting-started/configuration/
# Production URL. MUST match the serving origin or assets break (cross-origin +
# CSP). Swap to a custom domain later (then redeploy) when you add one.
base_url = "https://mmclinton.pages.dev"
title = "mmclinton"
description = "Writing, reading, and things I build."

compile_sass = true
minify_html = true
build_search_index = false
generate_feeds = true
feed_filenames = ["atom.xml"]

taxonomies = []

[markdown]
smart_punctuation = true
insert_anchor_links = "heading"
lazy_async_image = true
# Open external links in a new tab with rel="noopener noreferrer", matching book links.
external_links_target_blank = true
external_links_no_referrer = true

[markdown.highlighting]
style = "class"
light_theme = "github-light"
dark_theme = "github-dark"

[extra]
author = "m. clinton"
author_initials = "mmclinton"

[[extra.links]]
name = "GitHub"
url = "https://github.com/mmclinton"

[[extra.links]]
name = "Email"
url = "mailto:cloudflarepages.unquote220@simplelogin.com"

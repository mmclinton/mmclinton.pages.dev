<header class="site-header">
  <a class="wordmark" href="{{ get_url(path='/') | safe }}" aria-label="{{ config.extra.author }} — home"
    >{{ config.extra.author_initials }}</a
  >
  <nav class="site-nav" aria-label="Primary">
    <a href="{{ get_url(path='@/writing/_index.md') | safe }}">writing</a>
    <span class="dot" aria-hidden="true">·</span>
    <a href="{{ get_url(path='@/reading/_index.md') | safe }}">reading</a>
    <span class="dot" aria-hidden="true">·</span>
    <a href="{{ get_url(path='@/projects/_index.md') | safe }}">building</a>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">
      <span class="th-light" aria-hidden="true">☾</span>
      <span class="th-dark" aria-hidden="true">☀</span>
    </button>
    <button id="motion-toggle" class="motion-toggle" type="button" aria-label="Reduce background motion" aria-pressed="false">
      <span class="mo-full" aria-hidden="true">✦</span>
      <span class="mo-calm" aria-hidden="true">✧</span>
    </button>
  </nav>
</header>

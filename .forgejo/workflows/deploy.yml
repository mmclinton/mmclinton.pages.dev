name: deploy
on:
  push:
    branches: [main]

jobs:
  deploy:
    # Requires a self-hosted Forgejo runner registered with this label (Codeberg's
    # hosted runners are too limited for the Nix build). See DEPLOY.md.
    runs-on: self-hosted
    steps:
      - uses: https://github.com/actions/checkout@v4

      # Skip this step if your runner host already has Nix (host-mode runner).
      - uses: https://github.com/DeterminateSystems/nix-installer-action@main

      - name: Build
        run: nix develop --command ./scripts/build.sh

      - name: Deploy to Cloudflare Pages
        run: nix develop --command npx -y wrangler pages deploy public --project-name mmc-6wo --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

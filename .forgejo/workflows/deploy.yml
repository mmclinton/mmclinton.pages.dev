name: deploy
on:
  push:
    branches: [main]

jobs:
  deploy:
    # Runs on a self-hosted *host-mode* runner that already has Nix on PATH.
    # See CI-SETUP.md for the one-time runner setup. (For a Docker-mode runner,
    # re-add a nix install step, e.g. DeterminateSystems/nix-installer-action.)
    runs-on: self-hosted
    steps:
      - uses: https://github.com/actions/checkout@v4

      - name: Build
        run: nix develop --command ./scripts/build.sh

      - name: Deploy to Cloudflare Pages
        run: nix develop --command npx -y wrangler pages deploy public --project-name mmclinton --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
